<!DOCTYPE html>
<html>
<head>
    <title>My First DevOps</title>
</head>
<body>

<h1>Hello Kubernetes</h1>

<h2 id="version">Loading...</h2>

<script>
fetch("version.txt")
    .then(response => response.text())
    .then(version => {
        document.getElementById("version").innerText = version;
    });
</script>

</body>
</html>
